[pytest]
# TP-009 — test isolation from mutable production state.
#
# ``live_data`` marks READ-ONLY integration checks that read live production
# state (e.g. portfolio/transactions.json, portfolio/state.json). They must
# assert INVARIANTS (parses, well-formed fields, FIFO consistency, no forced
# sales) — never historical counts, which rot as the live book legitimately
# changes. Deselect them with:
#
#     pytest -m "not live_data"
markers =
    live_data: read-only check against live production state; asserts invariants, not historical counts
